<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <pattern id="holes" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="5" fill="#1d3b37"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="#2f5d57"/>
  <rect width="800" height="1000" fill="url(#holes)"/>
  <!-- hand saw -->
  <g transform="translate(150 150) rotate(8)">
    <path d="M0 0 H360 L330 96 H0 Z" fill="#e8e1d2"/>
    <path d="M0 96 l15 16 l15 -16 l15 16 l15 -16 l15 16 l15 -16 l15 16 l15 -16 l15 16 l15 -16 l15 16 l15 -16 l15 16 l15 -16 l15 16 l15 -16 l15 16 l15 -16 l15 16 l15 -16 l15 16 l15 -16 Z" fill="#e8e1d2"/>
    <rect x="-120" y="-16" width="140" height="130" rx="28" fill="#d8401f"/>
    <rect x="-86" y="18" width="70" height="60" rx="18" fill="#2f5d57"/>
  </g>
  <!-- spirit level -->
  <g transform="translate(120 430)">
    <rect width="560" height="84" rx="12" fill="#f0b63a"/>
    <rect x="230" y="20" width="100" height="44" rx="22" fill="#fdf3d2"/>
    <circle cx="280" cy="42" r="13" fill="#2f5d57"/>
    <rect x="40" y="26" width="60" height="32" rx="8" fill="#c28a17"/>
    <rect x="460" y="26" width="60" height="32" rx="8" fill="#c28a17"/>
  </g>
  <!-- set square -->
  <path d="M150 880 V610 L420 880 Z" fill="none" stroke="#e8e1d2" stroke-width="34" stroke-linejoin="round"/>
  <!-- tape measure -->
  <g transform="translate(560 740)">
    <rect x="-110" y="-110" width="220" height="220" rx="44" fill="#17130e"/>
    <circle r="62" fill="#d8401f"/>
    <circle r="20" fill="#17130e"/>
    <rect x="96" y="54" width="110" height="26" fill="#f0b63a"/>
  </g>
</svg>
