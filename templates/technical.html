<!doctype html>
<!--
  technical: near-black, a drafting grid, monospace labels and a framed panel.
  Slots: site, address, path, logo, kicker, title, description, art.
  Variables (set them in "theme"): accent, background, text, muted, line, fontDisplay, fontMono.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>technical card</title>
    <style>
      :root {
        --accent: #5ee6a8;
        --background: #0a0d12;
        --text: #e9eef5;
        --muted: #93a0b3;
        --line: rgb(233 238 245 / 0.16);
        --font-display: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', 'Liberation Sans', Arial, sans-serif;
        --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;
      }
      * { box-sizing: border-box; margin: 0; }
      [hidden] { display: none !important; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body { position: relative; background: var(--background); color: var(--text); font-family: var(--font-display); -webkit-font-smoothing: antialiased; }

      .grid { position: absolute; inset: 0; background:
        linear-gradient(var(--line) 1px, transparent 1px) 0 29px / 100% 30px,
        linear-gradient(90deg, var(--line) 1px, transparent 1px) 29px 0 / 30px 100%;
        opacity: 0.55; -webkit-mask-image: linear-gradient(100deg, transparent 30%, #000 100%); mask-image: linear-gradient(100deg, transparent 30%, #000 100%); }

      .frame { position: absolute; inset: 30px; border: 1px solid var(--line); }
      .frame::before, .frame::after { content: ''; position: absolute; width: 26px; height: 26px; border: 3px solid var(--accent); }
      .frame::before { left: -2px; top: -2px; border-right: 0; border-bottom: 0; }
      .frame::after { right: -2px; bottom: -2px; border-left: 0; border-top: 0; }

      .bar { position: absolute; left: 31px; right: 31px; top: 31px; height: 58px; padding: 0 30px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 18px; color: var(--muted); }
      .bar img { height: 28px; width: auto; }
      .bar .site { color: var(--text); font-weight: 700; white-space: nowrap; }
      .bar .path { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .bar .path::before { content: 'GET '; color: var(--accent); }

      .copy { position: absolute; left: 62px; top: 116px; bottom: 108px; width: 640px; display: flex; flex-direction: column; overflow: hidden; }
      .kicker { margin-top: auto; font-family: var(--font-mono); font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); flex: none; }
      .kicker::before { content: '// '; opacity: 0.7; }
      .no-kicker h1 { margin-top: auto; }
      h1 { margin-top: 22px; font-weight: 750; font-size: 82px; line-height: 1.03; letter-spacing: -0.03em; text-wrap: balance; overflow-wrap: break-word; }
      h1 em { font-style: normal; color: var(--accent); }
      .description { margin-top: 22px; max-width: 800px; font-family: var(--font-mono); font-size: 21px; line-height: 1.5; color: var(--muted); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; flex: none; }

      .status { position: absolute; left: 31px; right: 31px; bottom: 31px; height: 52px; padding: 0 30px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 17px; color: var(--muted); }
      .status::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px rgb(94 230 168 / 0.16); flex: none; }
      .status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* right-hand panel: the art in a frame, or a drawn scope when there is none */
      .panel { position: absolute; right: 76px; top: 137px; width: 362px; height: 362px; border: 1px solid var(--accent); padding: 10px; background: var(--background); }
      .panel img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .scope { position: relative; width: 100%; height: 100%; overflow: hidden; background: repeating-radial-gradient(circle at 50% 50%, transparent 0 41px, var(--line) 41px 42px); }
      .scope::before, .scope::after { content: ''; position: absolute; background: var(--accent); opacity: 0.55; }
      .scope::before { left: 0; right: 0; top: 50%; height: 1px; }
      .scope::after { top: 0; bottom: 0; left: 50%; width: 1px; }
      .scope i { position: absolute; left: 50%; top: 50%; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; border: 3px solid var(--accent); }
      .scope i::after { content: ''; position: absolute; inset: 30px; border-radius: 50%; background: var(--accent); }
      .has-art .scope { display: none; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="frame"></div>
    <header class="bar">
      <img data-slot="logo" alt="" />
      <span class="site" data-slot="site"></span>
      <span class="path" data-slot="path"></span>
    </header>
    <div class="panel"><img data-slot="art" alt="" /><div class="scope"><i></i></div></div>
    <main class="copy" data-fit-box>
      <p class="kicker" data-slot="kicker"></p>
      <h1 data-slot="title" data-fit="42 82"></h1>
      <p class="description" data-slot="description" data-fit-drop></p>
    </main>
    <footer class="status"><span data-slot="address"></span></footer>
  </body>
</html>
