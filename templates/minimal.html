<!doctype html>
<!--
  minimal: near-white, one weight of sans, a lot of empty space and a single dot of accent.
  Slots: site, address, logo, kicker, title, description, art.
  Variables (set them in "theme"): accent, background, text, muted, line, fontDisplay, fontBody.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>minimal card</title>
    <style>
      :root {
        --accent: #2747d8;
        --background: #fbfaf7;
        --text: #131416;
        --muted: #62656c;
        --line: #d9d7d0;
        --font-display: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', 'Liberation Sans', Arial, sans-serif;
        --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', 'Liberation Sans', Arial, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; }
      [hidden] { display: none !important; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body { position: relative; background: var(--background); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }

      .top { position: absolute; left: 80px; top: 64px; display: flex; align-items: center; gap: 14px; height: 40px; }
      .top img { height: 36px; width: auto; }
      .site { font-size: 23px; font-weight: 600; letter-spacing: -0.01em; }

      .copy { position: absolute; left: 80px; top: 150px; bottom: 124px; width: 1040px; display: flex; flex-direction: column; overflow: hidden; }
      .has-art .copy { width: 640px; }
      .kicker { margin-top: auto; display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 500; color: var(--muted); flex: none; }
      .kicker::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); flex: none; }
      .no-kicker h1 { margin-top: auto; }
      h1 { margin-top: 18px; font-family: var(--font-display); font-weight: 600; font-size: 84px; line-height: 1.04; letter-spacing: -0.035em; text-wrap: balance; overflow-wrap: break-word; }
      h1 em { font-style: normal; color: var(--accent); }
      .description { margin-top: 20px; max-width: 760px; font-size: 26px; line-height: 1.36; color: var(--muted); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; flex: none; }

      .foot { position: absolute; left: 80px; right: 80px; bottom: 60px; padding-top: 22px; border-top: 1px solid var(--line); font-size: 20px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .has-art .foot { right: 480px; }

      .art { position: absolute; right: 80px; top: 64px; width: 340px; height: 502px; border-radius: 28px; overflow: hidden; box-shadow: 0 1px 0 rgb(0 0 0 / 0.04), 0 24px 48px -24px rgb(19 20 22 / 0.28); }
      .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .no-art .art { display: none; }
    </style>
  </head>
  <body>
    <header class="top">
      <img data-slot="logo" alt="" />
      <span class="site" data-slot="site"></span>
    </header>
    <div class="art"><img data-slot="art" alt="" /></div>
    <main class="copy" data-fit-box>
      <p class="kicker" data-slot="kicker"></p>
      <h1 data-slot="title" data-fit="42 84"></h1>
      <p class="description" data-slot="description" data-fit-drop></p>
    </main>
    <footer class="foot" data-slot="address"></footer>
  </body>
</html>
